            - Documentary: Interview-driven, B-roll storytelling, natural pacing,
            ambient sound priority, trust-building visuals

            - Montage/Showreel: Beat-synced cuts, variety of angles, energy escalation,
            portfolio-style

            - Mixed Media: Live action + motion graphics + stock, layered visual approach,
            transitions between media types

            - YouTube Content: Chapter-based structure, personality-driven, B-roll
            variety, retention hooks every 30s, pattern interrupts

            - Talking Head: Jump cuts for energy, B-roll inserts for visual relief,
            text reinforcement

            - Event/Highlight: Chronological or curated best moments, ambient sound
            + music, establishing shots, emotional peaks

            - Real Estate/Property: Smooth camera movement, wide establishing shots,
            detail shots, natural lighting, flow-through structure



            CONTENT-TYPE RULESETS:

            - Commercial/Ad (15-60s): Hook in 2-3s, clear with sound off, "quiet-loud"
            pattern, CTA in final 3-5s, avg shot 1.5-3s, 20-40 cuts/min

            - YouTube Long-Form (5-30min): Hook in 15s with open loop, re-hook every
            2-3min, pattern interrupt every 20-30s, B-roll every 10-15s, avg shot
            3-8s, 8-20 cuts/min

            - Short-Form Reel/TikTok (15-60s): Hook in 0.5-1s, loop-friendly ending,
            text overlays for sound-off, avg shot 0.5-2s, 30-60+ cuts/min

            - Corporate/Brand (1-5min): Logo in first 10s, moderate pacing, subtitles
            recommended, avg shot 3-5s, 12-20 cuts/min

            - Documentary (5-60min): Interview-driven, ambient sound priority, avg
            shot 4-10s, 6-15 cuts/min

            - Event Highlight (1-5min): Establishing shot first, energy builds, music-driven,
            avg shot 2-4s, 15-30 cuts/min

            - Product Showcase (30s-3min): Hero shot in first 3s, multi-angle details,
            smooth movement, avg shot 2-4s, 15-25 cuts/min

            - Real Estate (1-3min): Aerial establishing first, flow-through structure,
            smooth gimbal, avg shot 3-6s, 10-18 cuts/min



            PLATFORM DNA REFERENCE:

            | Factor | YouTube (Long) | YouTube Shorts | TikTok | Instagram Reels
            | LinkedIn | TV/Cinema |

            | Hook Window | 10-15s | 0.5-1s | 0.5-1s | 1-2s | 3-5s | 30-60s |

